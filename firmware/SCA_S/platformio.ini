; SCA_S — Smart Clean Ashtray (한승찬) firmware
; ESP32-S3 DevKitC-1 (8MB flash) · Arduino framework · FreeRTOS 5-Task · 10-State FSM
;
;   pio run                 build
;   pio run -t uploadfs     upload TLS certificates (data/, see data/README.md)
;   pio run -t upload       upload firmware
;   pio test -e native      FSM unit tests on PC (needs gcc/MinGW)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_cache_dir = .pio/build_cache

; two 3.2MB app slots (OTA) + LittleFS for certificates
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

build_flags =
    -I include
    -I hal
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; ── Platform integration (docs/protocol.md) ──
    -D SCA_DEVICE_ID=\"SCA_S\"
    -D SCA_TYPE_ID=\"SCA_S\"
    -D SCA_FW_VERSION=\"1.0.0\"
    -D SCA_API_HOST=\"api.smart-clean-ashtray.com\"
    -D SCA_MQTT_HOST=\"mqtt.smart-clean-ashtray.com\"
    -D SCA_MQTT_PORT=8883
    ; ── Calibration (see hal/hal_pins.h, include/water_model.h) ──
    -D WATER_TANK_ML=500
    -D PUMP_FLOW_ML_PER_S=20
    -D ASH_EMPTY_MM=150
    -D ASH_FULL_MM=30

build_src_filter =
    +<*>
    +<../hal/*.cpp>

lib_deps =
    adafruit/Adafruit SSD1306 @ ~2.5.13
    adafruit/Adafruit GFX Library @ ~1.11.11
    knolleary/PubSubClient @ ~2.8
    bblanchon/ArduinoJson @ ~7.2.1

; ── Wokwi 시뮬레이션 빌드 (실제 기기용 아님) ─────────────────────────────
;   pio run -e wokwi  →  VS Code: "Wokwi: Start Simulator" (wokwi.toml, diagram.json)
[env:wokwi]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D SCA_DEFAULT_WIFI_SSID=\"Wokwi-GUEST\"   ; 시뮬레이터 가상 WiFi에 자동 접속
    -D SLEEP_QUIET_S=60          ; 절전 진입 10분 → 1분 (시뮬레이션에서 확인하기 쉽게)

[env:native]
platform = native
test_build_src = yes
build_type = test
build_src_filter = -<*> +<fsm.c>
build_flags = -D NATIVE_TEST -I include
