map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS 리다이렉트 + ACME challenge
server {
    listen 80;
    server_name smart-clean-ashtray.com *.smart-clean-ashtray.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# 루트 도메인 → www
server {
    listen 443 ssl;
    http2 on;
    server_name smart-clean-ashtray.com;
    include /etc/nginx/snippets/ssl.conf;
    return 301 https://www.smart-clean-ashtray.com$request_uri;
}

# 사용자 웹
server {
    listen 443 ssl;
    http2 on;
    server_name www.smart-clean-ashtray.com;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security.conf;

    location / { proxy_pass http://frontend:3000; }
}

# 관리자 웹 — IP allowlist
server {
    listen 443 ssl;
    http2 on;
    server_name admin.smart-clean-ashtray.com;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security.conf;
    include /etc/nginx/snippets/admin-allowlist.conf;

    location / { proxy_pass http://frontend:3000; }
}

# API
server {
    listen 443 ssl;
    http2 on;
    server_name api.smart-clean-ashtray.com;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security.conf;

    client_max_body_size 20m;   # 펌웨어 업로드

    proxy_set_header Host              $host;
    # X-Real-IP 는 Nginx가 직접 덮어씀 → 클라이언트가 위조 불가. FastAPI는 이 값만 신뢰
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 관리자 API도 동일 allowlist (admin 서브도메인만 막으면 api 경유로 우회 가능)
    location /admin/ {
        include /etc/nginx/snippets/admin-allowlist.conf;
        proxy_pass http://api:8000;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / { proxy_pass http://api:8000; }
}
