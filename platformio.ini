; PlatformIO Project Configuration File
;
; BUILD TIME NOTE:
;   First build: ~4-5 min (compiles all Adafruit libs + Arduino framework ~80 files)
;   Subsequent builds: ~10-30s (only changed files recompile, .pio/build cache reused)
;   Cache is INVALIDATED when: lib_deps changes, .pio folder deleted, PIO version updated
;   → Do NOT delete the .pio folder between builds to keep the cache.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
test_build_src = yes

; ── Build cache: reuse compiled library objects across builds ──────────────
build_cache_dir = .pio/build_cache

build_flags =
    -I include
    -I hal
    ; ESP32-S3 Native USB Serial CDC Output Flags
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; GPIO Pin Assignments (overridable)
    -D PIN_LED_DATA=4
    -D PIN_MQ135_ANALOG=5
    -D PIN_ULTRA_TRIG=6
    -D PIN_ULTRA_ECHO=7
    -D PIN_WATER_LEVEL=8
    -D PIN_OLED_SDA=21
    -D PIN_OLED_SCL=47
    -D PIN_DHT_DATA=14
    -D PIN_BUZZER=17
    -D PIN_PUMP_PWM=18

build_src_filter =
    +<*>
    +<../hal/*.c>
    +<../hal/*.cpp>

; ── Library dependencies (versions pinned with ~ to avoid auto-updates) ────
; Using ~ instead of ^ to prevent version updates that invalidate build cache
lib_deps =
    adafruit/Adafruit SH110X @ ~2.1.11
    adafruit/Adafruit GFX Library @ ~1.11.11
    beegee-tokyo/DHT sensor library for ESPx @ ~1.19.0
    adafruit/Adafruit Unified Sensor @ ~1.1.14
    knolleary/PubSubClient @ ~2.8

[env:native]
platform = native
test_build_src = yes
build_type = test
build_src_filter = -<*> +<task_state.c>
build_flags = -D NATIVE_TEST -I include
